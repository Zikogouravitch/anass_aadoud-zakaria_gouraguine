[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "support-agent"
version = "0.1.0"
description = "Agent_support_info : agent de support informatique de premier niveau"
requires-python = ">=3.11"
authors = [{ name = "Aadoud Anass" }, { name = "Gouraguine Zakaria" }]

[tool.setuptools.packages.find]
include = ["support_agent*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
check_untyped_defs = true
